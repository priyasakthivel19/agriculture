<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriBot - Agriculture Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #eef5ea;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 92vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2e7d32;
            color: #ffffff;
            padding: 18px 22px;
        }

        .chat-header h1 {
            font-size: 1.25rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f7faf5;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #2e7d32;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #e4efdf;
            color: #1f2d1f;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            background: #fdecea;
            color: #b3261e;
        }

        .message.typing {
            font-style: italic;
            opacity: 0.7;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #e0e6dc;
            background: #ffffff;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cdd8c8;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #2e7d32;
        }

        .chat-input button {
            padding: 0 24px;
            background: #2e7d32;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #256628;
        }

        .chat-input button:disabled {
            background: #9db89f;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>AgriBot</h1>
            <p>Your assistant for all things agriculture</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">Hello! I am AgriBot. Ask me anything about crops, soil, irrigation, pests, livestock and farming.</div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Ask an agriculture question..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const messagesEl = document.getElementById("messages");
        const inputEl = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        let history = [];

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            inputEl.disabled = isLoading;
            if (!isLoading) inputEl.focus();
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message) return;

            addMessage(message, "user");
            inputEl.value = "";
            setLoading(true);

            const typingEl = addMessage("AgriBot is typing...", "bot typing");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message, history })
                });
                const data = await response.json();
                typingEl.remove();

                if (!response.ok) {
                    addMessage(data.error || "Something went wrong.", "bot error");
                } else {
                    addMessage(data.reply, "bot");
                    history.push({ role: "user", text: message });
                    history.push({ role: "model", text: data.reply });
                }
            } catch (error) {
                typingEl.remove();
                addMessage("Unable to reach the server. Please try again.", "bot error");
            }

            setLoading(false);
        }

        sendBtn.addEventListener("click", sendMessage);
        inputEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
